description = "音質優先の音楽プレイヤー"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hifi-engine = { path = "../../engine" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
