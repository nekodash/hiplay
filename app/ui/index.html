<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiPlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">HiPlay</div>
    <label class="device">
      <span>出力</span>
      <select id="device"></select>
    </label>
    <div class="spacer"></div>
    <div class="actions">
      <button id="add-folder" class="ghost">フォルダを追加</button>
      <button id="add-files" class="ghost">ファイルを追加</button>
      <button id="clear" class="ghost" title="キューを空にして停止">クリア</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section class="now">
      <div class="cover" id="cover"><div class="cover-empty">♪</div></div>
      <div class="meta">
        <div class="title" id="title">再生していません</div>
        <div class="sub" id="sub">フォルダをドラッグ＆ドロップするか「フォルダを追加」から曲を入れてください</div>
      </div>

      <div class="signal" id="signal" hidden>
        <div class="row"><span class="label">音源</span><span id="src-fmt"></span></div>
        <div class="row"><span class="label">出力</span><span id="out-fmt"></span></div>
        <div class="badges" id="badges"></div>
      </div>

      <div class="transport">
        <div class="seek">
          <span class="time" id="pos">0:00</span>
          <input type="range" id="seekbar" min="0" max="0" step="0.1" value="0" disabled>
          <span class="time" id="dur">0:00</span>
        </div>
        <div class="buttons">
          <button id="prev" class="icon" title="前の曲（Shift+←）" aria-label="前の曲">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button id="toggle" class="icon primary" title="再生／一時停止（Space）" aria-label="再生">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button id="next" class="icon" title="次の曲（Shift+→）" aria-label="次の曲">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
        </div>
        <p class="note">音量は DAC・アンプ側で調整します（ソフトでは信号を変えません）</p>
      </div>
    </section>

    <section class="queue" id="queue-panel">
      <div class="queue-head">
        <span>キュー</span>
        <span class="count" id="count"></span>
      </div>
      <div class="queue-scroll">
        <table>
          <thead>
            <tr><th class="n">#</th><th>タイトル</th><th>アーティスト</th><th>アルバム</th><th class="d">時間</th></tr>
          </thead>
          <tbody id="queue"></tbody>
        </table>
        <div class="empty" id="empty">ここにフォルダやファイルをドロップ</div>
      </div>
    </section>
  </main>

  <div class="drop-overlay" id="drop" hidden>ドロップしてキューに追加</div>

  <script src="app.js"></script>
</body>
</html>
