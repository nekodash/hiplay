name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            # Intel と Apple Silicon の両方で動くユニバーサルバイナリにする
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles app,dmg
            artifact: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --bundles nsis
            artifact: target/release/bundle/nsis/*.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: install tauri cli
        working-directory: app
        run: npm ci

      - name: build app
        working-directory: app
        run: npx tauri build ${{ matrix.tauri-args }}

      - uses: actions/upload-artifact@v7
        with:
          name: hiplay-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
